<script defer src="js/share-dash.js?v=20260712-1"></script>
<script>
    // White-Label Logic for Share Page
    (async () => {
        try {
            const r = await fetch('/api/config');
            const cfg = await r.json();
            const brandName = cfg.projectName || 'Adlytics';
            const brandLogo = cfg.projectLogo;

            document.title = (document.getElementById('accountName').textContent || brandName) + ' - Relatório';
            document.getElementById('brand-name-text').textContent = brandName.toLowerCase();

            if (brandLogo) {
                const container = document.getElementById('project-logo-container');
                if (brandLogo.trim().startsWith('<svg')) {
                    container.innerHTML = brandLogo;
                    const svg = container.querySelector('svg');
                    if (svg) { svg.setAttribute('width', '48'); svg.setAttribute('height', '48'); }
                } else {
                    container.innerHTML = `<img src="${brandLogo}" style="width:48px;height:48px;object-fit:contain;border-radius:8px;">`;
                }
            }
        } catch(e) { console.error('WL error', e); }
    })();
</script>
